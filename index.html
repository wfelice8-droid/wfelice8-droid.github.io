<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little World ♡</title>

<style>
body {
    margin: 0;
    padding: 40px 20px;
    background: #10111b;
    color: #f0eaff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #c5a9ff;
}

.recording {
    max-width: 500px;
    margin: 25px auto;
    padding: 25px;
    background: #1c1d2b;
    border-radius: 15px;
}

audio {
    width: 100%;
    margin-top: 15px;
}

a {
    color: #c5a9ff;
}
</style>
</head>

<body>

<h1>My Little World ♡</h1>
<p>A place to keep these memories.</p>

<div class="recording">
    <h2>Voice Message</h2>
    <audio controls preload="none">
        <source src="voice-message.ogg" type="audio/ogg">
        Your browser does not support audio.
    </audio>
    <p><a href="voice-message.ogg">Open recording</a></p>
</div>

<div class="recording">
    <h2>I Love You Too</h2>
    <audio controls preload="none">
        <source src="I%20love%20you%20too.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>
    <p><a href="I%20love%20you%20too.mp3">Open recording</a></p>
</div>

</body>
</html>

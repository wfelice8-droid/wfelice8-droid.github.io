<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pictures & Memories</title>

<style>
body {
    margin: 0;
    padding: 25px;
    background: #17121f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #d8b4fe;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    max-width: 1000px;
    margin: 30px auto;
}

.gallery img {
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
}

a {
    display: inline-block;
    margin: 10px;
    padding: 14px 22px;
    background: #7045a3;
    color: white;
    text-decoration: none;
    border-radius: 10px;
}

#status {
    color: #c4b5d0;
}
</style>
</head>

<body>

<h1>📸 Pics & Memories</h1>
<p>A collection of memories ♡</p>

<div id="gallery" class="gallery"></div>
<p id="status">Loading memories...</p>

<a href="index.html">Home</a>
<a href="upload.html">⬆️ Upload</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://cgzwdimbiwtvhjfxtnon.supabase.co";
const SUPABASE_KEY = "sb_publishable_eRxpkKyITYRCL6a8oMjnFg_BdxrqB1T";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function loadGallery() {
    const gallery = document.getElementById("gallery");
    const status = document.getElementById("status");

    const { data, error } = await db.storage
        .from("my-memories")
        .list("", {
            limit: 100,
            sortBy: { column: "created_at", order: "desc" }
        });

    if (error) {
        status.textContent = "Couldn't load memories. Please check the gallery permissions.";
        return;
    }

    const photos = data.filter(file =>
        /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
    );

    if (photos.length === 0) {
        status.textContent = "No pictures uploaded yet ♡";
        return;
    }

    status.textContent = "";

    photos.forEach(file => {
        const { data: urlData } = db.storage
            .from("my-memories")
            .getPublicUrl(file.name);

        const img = document.createElement("img");
        img.src = urlData.publicUrl;
        img.alt = "Memory";
        img.loading = "lazy";

        gallery.appendChild(img);
    });
}

loadGallery();
</script>

</body>
</html>

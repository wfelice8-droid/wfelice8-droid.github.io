<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Memories</title>

<style>
body {
    background: #17121f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 15px;
}
h1 { color: #d8b4fe; }
.box {
    max-width: 420px;
    margin: 30px auto;
    padding: 25px;
    background: #261d31;
    border-radius: 15px;
}
input, button {
    box-sizing: border-box;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 9px;
}
button {
    background: #7045a3;
    color: white;
    cursor: pointer;
    font-size: 16px;
}
a { color: #d8b4fe; }
#status { overflow-wrap: anywhere; }
</style>
</head>

<body>

<h1>♡ Upload Memories</h1>
<p>Add photos, videos and voice messages.</p>

<div class="box">
    <input id="code" type="password"
        placeholder="Your private upload code">

    <input id="file" type="file"
        accept="image/*,audio/*,video/*">

    <button onclick="uploadMemory()">Upload Memory ♡</button>

    <p id="status"></p>
</div>

<p><a href="index.html">← Back Home</a></p>

<script>
const FUNCTION_URL =
"https://cgzwdimbiwtvhjfxtnon.supabase.co/functions/v1/upload-memory";

const PUBLIC_KEY =
"sb_publishable_eRxpkKyITYRCL6a8oMjnFg_BdxrqB1T";

async function uploadMemory() {
    const code = document.getElementById("code").value;
    const file = document.getElementById("file").files[0];
    const status = document.getElementById("status");

    if (!code || !file) {
        status.textContent = "Enter your code and choose a file.";
        return;
    }

    if (file.size > 50 * 1024 * 1024) {
        status.textContent = "File must be under 50 MB.";
        return;
    }

    const form = new FormData();
    form.append("file", file);

    status.textContent = "Uploading...";

    try {
        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "apikey": PUBLIC_KEY,
                "x-upload-code": code
            },
            body: form
        });

        const result = await response.json();

        if (!response.ok) {
            status.textContent = result.message || "Upload failed.";
            return;
        }

        status.textContent = "Uploaded successfully! ♡";
        document.getElementById("file").value = "";

    } catch (error) {
        status.textContent = "Connection error. Please try again.";
    }
}
</script>

</body>
</html>
